name: Démo web (GitHub Pages)

# Publie la version web de Cabas (mode démo : catalogue embarqué, aucun
# service externe) sur https://<propriétaire>.github.io/<dépôt>/.
# Prérequis (une fois) : Settings → Pages → Source « GitHub Actions ».
# Lancement manuel (onglet Actions → « Run workflow ») : tant que Pages n'est
# pas activé, un déclenchement à chaque push échouerait à l'étape Publier.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Export web sous /<dépôt>
        run: npx expo export --platform web --output-dir dist
        env:
          EXPO_BASE_URL: /${{ github.event.repository.name }}
          # Outils de démo : /dev/seed?variant=fresh|onboarded|premium et /design-system.
          EXPO_PUBLIC_DEV_TOOLS: '1'
      - name: Routes profondes (repli SPA) et dossier _expo servi tel quel
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publier
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
